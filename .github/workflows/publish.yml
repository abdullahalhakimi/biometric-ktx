name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Publishing is idempotent-only: never rebuild/retry on failure automatically, as Maven
    # Central versions are immutable and a partial upload would block the version forever.
    concurrency:
      group: maven-central-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must match the JDK the project is built with locally (AGP 9 / Gradle 9.5.1).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew :biometric:testDebugUnitTest --console=plain

      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --console=plain
        env:
          # Sonatype Central Portal user token (https://central.sonatype.com/usertoken)
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # ASCII-armored private GPG key + its passphrase, used to sign the artifacts.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
